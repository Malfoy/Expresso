[package]
name = "expresso-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
crc32fast = "1"
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
